name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  docs-in-ci:
    name: Docs-in-CI Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Docs Check
        run: bash scripts/check-docs.sh "${GITHUB_BASE_REF:-origin/master}" "${GITHUB_HEAD_REF:-HEAD}"

      - name: Run Changelog Check
        run: bash scripts/check-changelog.sh "${GITHUB_BASE_REF:-origin/master}" "${GITHUB_HEAD_REF:-HEAD}"

  build-clippy-test:
    name: Build, Clippy, and Test (Workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""

      - name: Cargo Build (Workspace)
        run: cargo build --workspace

      - name: Cargo Clippy (Workspace, All Targets, Deny Warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo Test (Workspace)
        run: cargo test --workspace

  smoke-test-server:
    name: Server Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build Server (Release)
        run: cargo build --release -p server

      - name: Start Server
        run: |
          MEMORIA_API_KEY=ci-smoke-test-key ./target/release/server &
          echo $! > server.pid
          for _ in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8080/health && break
            sleep 0.5
          done

      - name: Run Smoke Test
        env:
          MEMORIA_SMOKE_TEST_API_KEY: ci-smoke-test-key
        run: bash scripts/smoke-test-server.sh

      - name: Stop Server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
