name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  docs-in-ci:
    name: Docs-in-CI Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Docs Check
        run: bash scripts/check-docs.sh "${GITHUB_BASE_REF:-origin/master}" "${GITHUB_HEAD_REF:-HEAD}"

      - name: Run Changelog Check
        run: bash scripts/check-changelog.sh "${GITHUB_BASE_REF:-origin/master}" "${GITHUB_HEAD_REF:-HEAD}"

  verify-checker-scripts:
    name: Verify the Checker Scripts Themselves
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Configure Git Identity (required by the scripts below, which make temporary commits)
        run: |
          git config user.email "ci@memoria.invalid"
          git config user.name "memoria CI"

      - name: Run Verify-Check-Docs
        run: bash scripts/verify-check-docs.sh

      - name: Run Verify-Check-Changelog
        run: bash scripts/verify-check-changelog.sh

      - name: Warm Cargo Cache (verify-smoke-test-server.sh builds --offline)
        run: cargo build -p server

      - name: Run Verify-Smoke-Test-Server
        run: bash scripts/verify-smoke-test-server.sh

  build-clippy-test:
    name: Build, Clippy, and Test (Workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""

      - name: Cargo Build (Workspace)
        run: cargo build --workspace

      - name: Cargo Clippy (Workspace, All Targets, Deny Warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo Test (Workspace)
        run: cargo test --workspace

      - name: Cargo Build (ollama feature)
        run: cargo build -p memoria-core -p cli -p server -p mcp --features ollama

      - name: Cargo Clippy (ollama feature, All Targets, Deny Warnings)
        run: cargo clippy -p memoria-core -p cli -p server -p mcp --features ollama --all-targets -- -D warnings

      - name: Cargo Test (ollama feature, non-network cases only)
        run: cargo test -p memoria-core -p cli -p server -p mcp --features ollama

      - name: Cargo Build (fastembed feature)
        run: cargo build -p memoria-core -p cli -p server -p mcp --features fastembed

      - name: Cargo Clippy (fastembed feature, All Targets, Deny Warnings)
        run: cargo clippy -p memoria-core -p cli -p server -p mcp --features fastembed --all-targets -- -D warnings

      - name: Cargo Test (fastembed feature, non-network cases only)
        run: cargo test -p memoria-core -p cli -p server -p mcp --features fastembed

      - name: Cargo Build (sqlite feature)
        run: cargo build -p memoria-core -p server -p mcp --features sqlite

      - name: Cargo Clippy (sqlite feature, All Targets, Deny Warnings)
        run: cargo clippy -p memoria-core -p server -p mcp --features sqlite --all-targets -- -D warnings

      - name: Cargo Test (sqlite feature, non-network cases only)
        run: cargo test -p memoria-core -p server -p mcp --features sqlite

      - name: Cargo Build (candle feature)
        run: cargo build -p memoria-core -p cli -p server -p mcp --features candle

      - name: Cargo Clippy (candle feature, All Targets, Deny Warnings)
        run: cargo clippy -p memoria-core -p cli -p server -p mcp --features candle --all-targets -- -D warnings

      - name: Cargo Test (candle feature, non-network cases only)
        run: cargo test -p memoria-core -p cli -p server -p mcp --features candle

      - name: Cargo Build (postgres feature)
        run: cargo build -p memoria-core -p server -p mcp --features postgres

      - name: Cargo Clippy (postgres feature, All Targets, Deny Warnings)
        run: cargo clippy -p memoria-core -p server -p mcp --features postgres --all-targets -- -D warnings

      - name: Cargo Test (postgres feature, non-live cases only)
        run: cargo test -p memoria-core -p server -p mcp --features postgres

      - name: Cargo Build (qdrant feature)
        run: cargo build -p memoria-core -p server -p mcp --features qdrant

      - name: Cargo Clippy (qdrant feature, All Targets, Deny Warnings)
        run: cargo clippy -p memoria-core -p server -p mcp --features qdrant --all-targets -- -D warnings

      - name: Cargo Test (qdrant feature, non-live cases only)
        run: cargo test -p memoria-core -p server -p mcp --features qdrant

      - name: Cargo Build (chroma feature)
        run: cargo build -p memoria-core -p server -p mcp --features chroma

      - name: Cargo Clippy (chroma feature, All Targets, Deny Warnings)
        run: cargo clippy -p memoria-core -p server -p mcp --features chroma --all-targets -- -D warnings

      - name: Cargo Test (chroma feature, non-live cases only)
        run: cargo test -p memoria-core -p server -p mcp --features chroma

  test-real-qdrant:
    name: Real Qdrant Contract Test (ADR-47 Increment 1)
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Wait for Qdrant to Accept Connections
        run: |
          for _ in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:6333/healthz && break
            sleep 1
          done

      - name: Run Real QdrantVectorStore Contract Tests (VectorStoreContractTests, live against qdrant/qdrant)
        env:
          MEMORIA_TEST_QDRANT_URL: http://127.0.0.1:6334
        run: |
          cargo test -p memoria-core --features qdrant qdrant_tests -- --ignored --test-threads=8

      - name: Run Real resolve_vector_store Qdrant Tests (server, mcp)
        env:
          MEMORIA_TEST_QDRANT_URL: http://127.0.0.1:6334
        run: |
          cargo test -p server -p mcp --features qdrant resolve_vector_store_qdrant_choice_builds -- --ignored

  test-real-chroma:
    name: Real Chroma Contract Test (ADR-48 Increment 1)
    runs-on: ubuntu-latest
    services:
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Wait for Chroma to Accept Connections
        run: |
          for _ in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8000/api/v2/heartbeat && break
            sleep 1
          done

      - name: Run Real ChromaVectorStore Contract Tests (VectorStoreContractTests, live against chromadb/chroma)
        env:
          MEMORIA_TEST_CHROMA_URL: http://127.0.0.1:8000
        run: |
          cargo test -p memoria-core --features chroma chroma_tests -- --ignored --test-threads=8

      - name: Run Real resolve_vector_store Chroma Tests (server, mcp)
        env:
          MEMORIA_TEST_CHROMA_URL: http://127.0.0.1:8000
        run: |
          cargo test -p server -p mcp --features chroma resolve_vector_store_chroma_choice_builds -- --ignored

  test-real-pgvector:
    name: Real pgvector Contract + Hybrid Search Test (ADR-46 Increments 2-3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: memoria
          POSTGRES_DB: memoria
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Run Real PgVectorStore Contract Tests (VectorStoreContractTests, live against pgvector/pgvector)
        env:
          MEMORIA_TEST_POSTGRES_URL: postgres://postgres:memoria@127.0.0.1:5432/memoria
        run: |
          cargo test -p memoria-core --features postgres postgres_tests -- --ignored --test-threads=4

      - name: Run Real resolve_vector_store Postgres Tests (server, mcp)
        env:
          MEMORIA_TEST_POSTGRES_URL: postgres://postgres:memoria@127.0.0.1:5432/memoria
        run: |
          cargo test -p server -p mcp --features postgres resolve_vector_store_postgres_choice_builds -- --ignored

      - name: Run Real PgVectorStore Hybrid Search Test (Memory::search combining semantic + Postgres full-text keyword_search)
        env:
          MEMORIA_TEST_POSTGRES_URL: postgres://postgres:memoria@127.0.0.1:5432/memoria
        run: |
          cargo test -p memoria-core --features postgres real_postgres_hybrid_search -- --ignored

  coverage:
    name: Code Coverage (core, all features, reported not gated)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --no-default-features

      - name: Run Coverage (memoria-core, all features)
        run: cargo tarpaulin -p memoria-core --lib --features ollama,sqlite,fastembed --exclude-files 'cli/*' 'server/*' --out Stdout

  smoke-test-cli:
    name: CLI Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build CLI (Release)
        run: cargo build --release -p cli

      - name: Run Smoke Test
        env:
          MEMORIA_SMOKE_TEST_CLI_BIN: ./target/release/cli
        run: bash scripts/smoke-test-cli.sh

  smoke-test-server:
    name: Server Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build Server (Release)
        run: cargo build --release -p server

      - name: Start Server
        run: |
          MEMORIA_API_KEY=ci-smoke-test-key MEMORIA_JWT_SECRET=ci-smoke-test-jwt-secret ./target/release/server &
          echo $! > server.pid
          for _ in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8080/health && break
            sleep 0.5
          done

      - name: Run Smoke Test
        env:
          MEMORIA_SMOKE_TEST_API_KEY: ci-smoke-test-key
        run: bash scripts/smoke-test-server.sh

      - name: Stop Server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  smoke-test-mcp:
    name: MCP Server Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build MCP Server (Release)
        run: cargo build --release -p mcp

      - name: Run Smoke Test
        env:
          MEMORIA_SMOKE_TEST_MCP_BIN: ./target/release/mcp
        run: bash scripts/smoke-test-mcp.sh

  docker-nonroot:
    name: Docker Non-Root and Reachability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Docker Non-Root/Reachability Test
        run: bash scripts/test-docker-nonroot.sh

  smoke-test-server-ollama:
    name: Server Smoke Test (real Ollama, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Pull Ollama Models
        run: |
          curl -s -X POST http://127.0.0.1:11434/api/pull -d '{"name":"qwen2.5:0.5b","stream":false}'
          curl -s -X POST http://127.0.0.1:11434/api/pull -d '{"name":"nomic-embed-text","stream":false}'

      - name: Build Server (Release, ollama feature)
        run: cargo build --release -p server --features ollama

      - name: Start Server
        env:
          MEMORIA_API_KEY: ci-smoke-test-key
          MEMORIA_JWT_SECRET: ci-smoke-test-jwt-secret
          MEMORIA_LLM_PROVIDER: ollama
          MEMORIA_EMBEDDING_PROVIDER: ollama
          MEMORIA_LLM_BASE_URL: http://127.0.0.1:11434
          MEMORIA_EMBEDDING_BASE_URL: http://127.0.0.1:11434
        run: |
          ./target/release/server &
          echo $! > server.pid
          for _ in $(seq 1 40); do
            curl -s -o /dev/null http://127.0.0.1:8080/health && break
            sleep 1
          done

      - name: Run Smoke Test
        env:
          MEMORIA_SMOKE_TEST_API_KEY: ci-smoke-test-key
        run: bash scripts/smoke-test-server.sh

      - name: Stop Server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  smoke-test-server-fastembed:
    name: Server Smoke Test (real fastembed, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build Server (Release, fastembed feature)
        run: cargo build --release -p server --features fastembed

      - name: Start Server
        env:
          MEMORIA_API_KEY: ci-smoke-test-key
          MEMORIA_JWT_SECRET: ci-smoke-test-jwt-secret
          MEMORIA_EMBEDDING_PROVIDER: fastembed
        run: |
          ./target/release/server &
          echo $! > server.pid
          for _ in $(seq 1 120); do
            curl -s -o /dev/null http://127.0.0.1:8080/health && break
            sleep 2
          done

      - name: Run Smoke Test
        env:
          MEMORIA_SMOKE_TEST_API_KEY: ci-smoke-test-key
        run: bash scripts/smoke-test-server.sh

      - name: Stop Server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  smoke-test-server-candle:
    name: Server Smoke Test (real candle, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build Server (Release, candle feature)
        run: cargo build --release -p server --features candle

      - name: Start Server
        env:
          MEMORIA_API_KEY: ci-smoke-test-key
          MEMORIA_JWT_SECRET: ci-smoke-test-jwt-secret
          MEMORIA_LLM_PROVIDER: candle
        run: |
          ./target/release/server &
          echo $! > server.pid
          for _ in $(seq 1 120); do
            curl -s -o /dev/null http://127.0.0.1:8080/health && break
            sleep 2
          done

      - name: Run Smoke Test
        env:
          MEMORIA_SMOKE_TEST_API_KEY: ci-smoke-test-key
        run: bash scripts/smoke-test-server.sh

      - name: Stop Server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  test-real-pipeline:
    name: Real Hybrid Search + Rerank Pipeline Test (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Run Real Pipeline Test (sqlite hybrid search + candle-backed LlmReranker, real fastembed embeddings)
        env:
          MEMORIA_TEST_FASTEMBED_CACHE_DIR: ${{ runner.temp }}/fastembed-model-cache
          MEMORIA_TEST_CANDLE_CACHE_DIR: ${{ runner.temp }}/candle-model-cache
        run: |
          cargo test -p memoria-core --release --features sqlite,fastembed,candle -- \
            --ignored real_hybrid_search_and_real_rerank_surface_the_genuinely_relevant_record_first

  opencode-plugin-checks:
    name: OpenCode Plugin (type-check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/opencode-plugin
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --omit=peer --frozen-lockfile

      - name: Type Check
        run: bun run type-check

      - name: Test
        run: bun test

  opencode-plugin-e2e:
    name: OpenCode Plugin Real End-to-End Test (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pinned Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install OpenCode
        run: |
          bun install -g opencode-ai
          opencode --version

      - name: Pull Ollama Model
        run: curl -s -X POST http://127.0.0.1:11434/api/pull -d '{"name":"qwen2.5:0.5b","stream":false}'

      - name: Build Server and MCP (Release)
        run: cargo build --release -p server -p mcp

      - name: Build Plugin
        working-directory: integrations/opencode-plugin
        run: |
          bun install --omit=peer --frozen-lockfile
          bun run build

      - name: Run Real End-to-End Smoke Test
        env:
          MEMORIA_SMOKE_TEST_SERVER_BIN: ${{ github.workspace }}/target/release/server
          MEMORIA_SMOKE_TEST_MCP_BIN: ${{ github.workspace }}/target/release/mcp
          MEMORIA_SMOKE_TEST_PLUGIN_DIST: ${{ github.workspace }}/integrations/opencode-plugin/dist/index.js
          MEMORIA_SMOKE_TEST_OLLAMA_MODEL: qwen2.5:0.5b
        run: bash scripts/smoke-test-opencode-plugin.sh
