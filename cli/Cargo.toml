[package]
name = "cli"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
core = { package = "memoria-core", path = "../core", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
ollama = ["core/ollama"]
fastembed = ["core/fastembed"]
candle = ["core/candle"]
