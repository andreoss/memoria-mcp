[package]
name = "server"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
core = { package = "memoria-core", path = "../core", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "signal", "sync"] }
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
hmac = "0.12.1"
base64 = "0.22.1"
getrandom = "0.4.3"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
argon2 = "0.5"

[features]
ollama = ["core/ollama"]
fastembed = ["core/fastembed"]
sqlite = ["core/sqlite"]
