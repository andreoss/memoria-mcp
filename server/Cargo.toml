[package]
name = "server"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros"] }
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
