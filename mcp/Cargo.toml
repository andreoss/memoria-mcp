[package]
name = "mcp"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
memoria-core = { path = "../core", features = ["serde"] }
rmcp = { version = "3.1.4", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["sqlite"]
ollama = ["memoria-core/ollama"]
fastembed = ["memoria-core/fastembed"]
sqlite = ["memoria-core/sqlite"]
candle = ["memoria-core/candle"]
postgres = ["memoria-core/postgres"]
