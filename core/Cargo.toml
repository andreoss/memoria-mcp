[package]
name = "memoria-core"
version = "0.1.0"
edition = "2021"
publish = true
description = "Self-hosted memory engine for AI agents: providers, vector storage, and the core Memory API."

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"], optional = true }
serde_json = "1"

[features]
serde = ["dep:serde"]
ollama = ["dep:reqwest"]
