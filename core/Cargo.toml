[package]
name = "memoria-core"
version = "0.1.0"
edition = "2021"
publish = true
description = "Self-hosted memory engine for AI agents: providers, vector storage, and the core Memory API."
readme = "../README.md"
keywords = ["memory", "ai-agents", "llm", "embeddings", "rag"]
categories = ["database", "data-structures"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"], optional = true }
serde_json = "1"
fastembed = { version = "6", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"], optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
candle-core = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig"], optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"], optional = true }

[features]
serde = ["dep:serde"]
ollama = ["dep:reqwest"]
fastembed = ["dep:fastembed"]
sqlite = ["dep:rusqlite"]
candle = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
