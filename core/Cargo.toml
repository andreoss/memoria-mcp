[package]
name = "memoria-core"
version = "0.1.0"
edition = "2021"
publish = true
description = "Self-hosted memory engine for AI agents: providers, vector storage, and the core Memory API."
readme = "../README.md"
keywords = ["memory", "ai-agents", "llm", "embeddings", "rag"]
categories = ["database", "data-structures"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"], optional = true }
serde_json = "1"
fastembed = { version = "6", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"], optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
candle-core = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig"], optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"], optional = true }
postgres = { version = "0.19", features = ["with-serde_json-1"], optional = true }
pgvector = { version = "0.4", default-features = false, features = ["postgres"], optional = true }
qdrant-client = { version = "1.19", default-features = false, features = ["uuid"], optional = true }
uuid = { version = "1", features = ["v5"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }
tonic = { version = "0.14", default-features = false, optional = true }
chroma = { version = "0.15", default-features = false, features = ["rustls"], optional = true }
milvus = { package = "milvus-sdk-rust", version = "2.6", optional = true }

[features]
serde = ["dep:serde"]
ollama = ["dep:reqwest"]
fastembed = ["dep:fastembed"]
sqlite = ["dep:rusqlite"]
candle = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
postgres = ["dep:postgres", "dep:pgvector"]
qdrant = ["dep:qdrant-client", "dep:uuid", "dep:tokio", "dep:tonic"]
chroma = ["dep:chroma", "dep:tokio", "dep:reqwest"]
milvus = ["dep:milvus", "dep:tokio"]
